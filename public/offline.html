<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeSync — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 12px;
      }
      h1 { font-size: 1.25rem; margin: 0; }
      p { color: #a1a1aa; margin: 0; max-width: 26rem; }
      button {
        margin-top: 12px;
        height: 48px;
        padding: 0 20px;
        border-radius: 10px;
        border: none;
        background: #6366f1;
        color: white;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>VibeSync can't reach the network right now. Financial and shift data always needs a live connection, so reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Flat terracotta backplate — must stay a solid fill, not a gradient:
       generate-icons.ts's maskable-safe-zone padding extends this edge by
       sampling a solid background color, so a gradient here would show a
       seam at the padding boundary. -->
  <rect width="512" height="512" rx="112" fill="#b8431a" />

  <!-- Two overlapping "petal" shapes (rounded-square-with-one-sharp-corner,
       the classic leaf/teardrop silhouette) forming a soft interlocked knot
       — keeps the old mark's "two things joined" idea for a two-user app,
       but organic/warm instead of hard geometric arrows. -->
  <path
    d="M0,0 L95,0 A95,95 0 0 1 190,95 A95,95 0 0 1 95,190 A95,95 0 0 1 0,95 Z"
    transform="translate(135,95) rotate(-45 95 95)"
    fill="#fdf3eb"
  />
  <path
    d="M0,0 L95,0 A95,95 0 0 1 190,95 A95,95 0 0 1 95,190 A95,95 0 0 1 0,95 Z"
    transform="translate(187,222) rotate(135 95 95)"
    fill="#f3dcd0"
    fill-opacity="0.92"
  />

  <!-- Small "seed" where the two petals cross — reads as woven together
       rather than just stacked. -->
  <circle cx="256" cy="253" r="14" fill="#8f3212" fill-opacity="0.35" />
</svg>
